kind = "web"
previewPath = "/"
title = "Smart Budget Splitter"
version = "1.0.0"
id = "artifacts/budget-splitter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24326

[services.development]
run = "pnpm --filter @workspace/budget-splitter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/budget-splitter", "run", "build" ]
publicDir = "artifacts/budget-splitter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24326"
BASE_PATH = "/"
